resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

acme_client letsencrypt https://acme-v02.api.letsencrypt.org/directory
    key_type=ecdsa
    challenge=http;

# Localhost demo (no real Let's Encrypt cert possible): serve the SPA directly
# on :80 so `http://localhost/` works without HTTPS. Real deployments should
# open `https://<DOMAIN>/`; the block below handles the redirect.
server {
    listen 80;
    server_name localhost 127.0.0.1 [::1];

    location / {
        root /usr/share/angie/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        # Handled automatically by ACME module
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate $acme_cert_letsencrypt;
    ssl_certificate_key $acme_cert_key_letsencrypt;
    acme letsencrypt;

    location / {
        root /usr/share/angie/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        proxy_pass http://api:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3009/;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
